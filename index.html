<!DOCTYPE html>  <html lang="bn">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1">  
<title>AIwithTaha – Hand Dither</title>  
<style>  
  :root { --bg:#05060a; --fg:#fff; --mut:#8a90a2; --acc:#b6ff00; }  
  * { box-sizing:border-box; }  
  body { margin:0; background:var(--bg); color:var(--fg);  
         font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif; }  
  main { max-width:640px; margin:0 auto; padding:32px 20px 48px; }  
  h1 { font-size:clamp(2.4rem,11vw,4rem); line-height:1; letter-spacing:-.04em; margin:0 0 16px; }  
  h1 span { color:var(--acc); }  
  p { color:var(--mut); line-height:1.5; }  
  button { background:#f1f1f1; color:#000; border:0; border-radius:999px;  
           padding:16px 28px; font-size:1.05rem; font-weight:600; }  
  button:disabled { opacity:.6; }  
  #status { margin:14px 0 24px; color:var(--mut); min-height:1.5em; }  
  .stage { position:relative; aspect-ratio:3/4; background:#000;  
           border-radius:24px; overflow:hidden; border:1px solid #1c2030; }  
  video { display:none; }  
  canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }  
</style>  
</head>  
<body>  
<main>  
  <h1>Move your <span>hands.</span><br>Control the pixels.</h1>  
  <p>Live camera + MediaPipe hand tracking + dither effect, সবকিছু ব্রাউজারেই চলে।</p>  
  <button id="startBtn">Start camera</button>  
  <div id="status">Camera is off</div>  
  <div class="stage">  
    <video id="video" autoplay playsinline muted></video>  
    <canvas id="canvas"></canvas>  
  </div>  
</main>  
<script type="module" src="script.js"></script>  
</body>  
</html>
